# add-ai-user: every SSH session of the members of the "add-ai-user" group goes
# through tmux (or sftp), so that the owner can watch and read back what AIs do. See
# /usr/local/lib/add-ai-user/ssh-gate. Installed by add-ai-user.sh, removed by --uninstall.
Match Group add-ai-user
    ForceCommand /usr/local/lib/add-ai-user/ssh-gate
Match all
