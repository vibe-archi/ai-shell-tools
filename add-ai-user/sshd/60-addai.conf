# addai: every SSH session of the members of the "addai" group goes through tmux
# (or sftp), so that the owner can watch and read back what AIs do.
# See /usr/local/lib/addai/ssh-gate. Installed by add-ai-user.sh, removed by add-ai-user.sh --uninstall.
Match Group addai
    ForceCommand /usr/local/lib/addai/ssh-gate
Match all
