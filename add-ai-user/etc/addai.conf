# /etc/addai/addai.conf: settings shared by the addai ssh-gate, pane-logger and
# tmux-logs-janitor. Shell syntax (KEY=value), read by sh and python.

# Host name shown in the "connection refused" message (default: the machine's FQDN)
SSH_HOST=

# Pane recordings (~/tmux-logs of each addai user)
LOG_CHUNK_MB=50          # a pane log starts a new file every LOG_CHUNK_MB
LOG_MIN_FREE_MB=2048     # recording is suspended below this much free disk space
LOG_KEEP_DAYS=30         # logs older than this are deleted
LOG_MAX_TOTAL_MB=2048    # per user cap, the oldest compressed logs go first
